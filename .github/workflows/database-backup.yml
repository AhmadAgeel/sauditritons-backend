name: Production database backup

on:
  workflow_dispatch:
  schedule:
    - cron: "31 9 * * *"

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'falsenayin/sauditritons-backend' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.BACKUP_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BACKUP_API_URL: https://api.sauditritons.org/internal/backups/database
      MAX_BACKUP_BYTES: "26214400"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify backup configuration
        shell: bash
        env:
          BACKUP_EXPORT_TOKEN: ${{ secrets.BACKUP_EXPORT_TOKEN }}
        run: |
          if [ -z "$BACKUP_EXPORT_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret: BACKUP_EXPORT_TOKEN"
            exit 1
          fi
      - name: Create and validate encrypted backup
        id: backup
        shell: bash
        env:
          BACKUP_EXPORT_TOKEN: ${{ secrets.BACKUP_EXPORT_TOKEN }}
        run: bash scripts/backup_to_artifact.sh
      - name: Store encrypted backup for seven days
        uses: actions/upload-artifact@v4
        with:
          name: ssa-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.backup.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
